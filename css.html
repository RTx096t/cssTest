<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS for beginners</title>
    <style>
        * {                    /* for all elements */
            margin: 10px;
            /* padding: 5px; */
        } 
        p {
            color: green;
        }
        h1 {
            color: rgb(28, 28, 90);
        }
        .another {
            color: red;
        }
        #two {
            color: rgb(248, 153, 12);
        }
    </style>
</head>
<body>
    <p>this is paragraph </p>
    <p class="another">this is another</p>
    <p>Lorem ipsum dolor sit amet</p>
    <p>Lorem ipsum dolor dore</p>
    <h1>This is a 1 heading</h1>
    <h1 id="two">This is a 2 heading</h1>
    <h1>This is a 3 heading</h1>
    <a href="https://www.google.com" class="another">this is a link</a>
</body>
</html>
